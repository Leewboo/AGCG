<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>全将战棋</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="selectionModal" class="modal">
        <div class="modal-content">
            <h2 class="modal-title">选择武将</h2>
            <p id="selectionPrompt" class="modal-subtitle">玩家1 选择 5 个武将</p>
            <div id="pieceSelection" class="piece-select"></div>
            <p id="selectedCount" class="selected-count">已选择: 0/5</p>
            <div style="display: flex; gap: 12px;">
                <button id="confirmSelection" class="btn btn-primary" style="flex: 1;" disabled>确认选择</button>
            </div>
        </div>
    </div>

    <div id="placementPhase" style="display: none;">
        <div class="game-container">
            <div class="phase-header">
                <h2 id="placementTitle" class="phase-title">玩家1 布阵</h2>
                <p id="placementSubtitle" class="phase-subtitle">即将放置: 关羽 (蓝色区域可放置)</p>
                <div id="placementGeneralSelector" class="general-selector"></div>
            </div>
            <div class="board-wrapper">
                <div id="gameBoard" class="game-board"></div>
            </div>
        </div>
    </div>

    <div id="gamePhase" style="display: none;">
        <div class="game-container">
            <div class="board-wrapper">
                <div>
                    <div id="turnIndicator" class="turn-indicator player1">玩家1 回合</div>
                    <div id="gameBoard" class="game-board"></div>
                    <div class="action-buttons">
                        <button id="endTurnBtn" class="btn btn-primary">结束回合</button>
                        <button id="restartBtn" class="btn btn-danger">重新开始</button>
                    </div>
                </div>
            </div>
            
            <div class="panels">
                <div class="panel">
                    <h3 class="panel-title">武将信息</h3>
                    <div id="pieceInfo" class="piece-info">
                        <p style="color: var(--text-secondary);">选择一个武将查看信息</p>
                    </div>
                </div>

                <div class="panel">
                    <h3 class="panel-title">技能</h3>
                    <div id="skillButtons" class="skill-buttons">
                        <p style="color: var(--text-secondary);">选择武将查看技能</p>
                    </div>
                </div>

                <div class="panel">
                    <h3 class="panel-title">战斗日志</h3>
                    <div id="gameLog" class="log-container"></div>
                </div>

                <div class="panel">
                    <h3 class="panel-title">地形说明</h3>
                    <div class="terrain-guide">
                        <div class="terrain-item">
                            <div class="terrain-swatch" style="background: var(--bg-secondary);"></div>
                            <span>草地 - 正常移动</span>
                        </div>
                        <div class="terrain-item">
                            <div class="terrain-swatch" style="background: var(--terrain-forest);"></div>
                            <span>🌲 森林 - 防御+10%</span>
                        </div>
                        <div class="terrain-item">
                            <div class="terrain-swatch" style="background: var(--terrain-mountain);"></div>
                            <span>⛰ 山地 - 防御+20%</span>
                        </div>
                        <div class="terrain-item">
                            <div class="terrain-swatch" style="background: var(--terrain-water);"></div>
                            <span>💧 水域 - 不可通过</span>
                        </div>
                        <div class="terrain-item">
                            <div class="terrain-swatch" style="background: var(--terrain-castle);"></div>
                            <span>🏰 城池 - 防御+30%</span>
                        </div>
                        <div class="terrain-item">
                            <div class="terrain-swatch" style="background: var(--terrain-swamp);"></div>
                            <span>🌿 沼泽 - 防御-10%</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/range.js"></script>
    <script src="js/effect.js"></script>
    <script src="js/game.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            Game.init();
        });
    </script>
</body>
</html>
