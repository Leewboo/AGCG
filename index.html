<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全将战棋</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #eee;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            display: flex;
            gap: 20px;
            max-width: 1400px;
            width: 100%;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(10, 60px);
            grid-template-rows: repeat(8, 60px);
            gap: 2px;
            background: #333;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .cell {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            font-size: 24px;
            font-weight: bold;
            border-radius: 5px;
        }

        .cell.grass { background: #2d5016; }
        .cell.forest { background: #1a3a0a; }
        .cell.mountain { background: #4a4a4a; }
        .cell.water { background: #1e3a5f; }
        .cell.default { background: #4a5568; }

        .cell:hover {
            filter: brightness(1.2);
        }

        .cell.selected {
            box-shadow: inset 0 0 0 3px #ffd700;
        }

        .cell.move-range {
            box-shadow: inset 0 0 0 3px #4ade80;
        }

        .cell.attack-range {
            box-shadow: inset 0 0 0 3px #f87171;
        }

        .piece {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            z-index: 10;
        }

        .piece.player1 {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            border: 3px solid #fca5a5;
        }

        .piece.player2 {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            border: 3px solid #93c5fd;
        }

        .panel {
            background: #2d3748;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            min-width: 280px;
        }

        .panel h3 {
            margin-bottom: 15px;
            color: #ffd700;
            border-bottom: 2px solid #4a5568;
            padding-bottom: 10px;
        }

        .turn-indicator {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 10px;
        }

        .turn-indicator.player1 { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); }
        .turn-indicator.player2 { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); }

        .piece-info {
            margin-bottom: 15px;
            padding: 15px;
            background: #1a202c;
            border-radius: 8px;
        }

        .health-bar {
            height: 20px;
            background: #374151;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }

        .health-fill {
            height: 100%;
            background: linear-gradient(90deg, #ef4444 0%, #22c55e 100%);
            transition: width 0.3s;
        }

        .energy-bar {
            height: 15px;
            background: #374151;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }

        .energy-fill {
            height: 100%;
            background: linear-gradient(90deg, #8b5cf6 0%, #6366f1 100%);
            transition: width 0.3s;
        }

        .skill-btn {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.2s;
        }

        .skill-btn.active {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white;
        }

        .skill-btn.disabled {
            background: #4a5568;
            color: #9ca3af;
            cursor: not-allowed;
        }

        .skill-btn.passive {
            background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%);
            color: white;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.2s;
            margin: 5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .log-container {
            max-height: 200px;
            overflow-y: auto;
            background: #1a202c;
            padding: 10px;
            border-radius: 8px;
            margin-top: 15px;
        }

        .log-entry {
            padding: 5px 0;
            border-bottom: 1px solid #374151;
            font-size: 13px;
        }

        .terrain-label {
            position: absolute;
            top: 2px;
            right: 2px;
            font-size: 10px;
            color: rgba(255,255,255,0.6);
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: #2d3748;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 500px;
        }

        .piece-select {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 20px 0;
        }

        .piece-option {
            padding: 20px;
            background: #4a5568;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .piece-option:hover {
            background: #6b7280;
            transform: scale(1.05);
        }

        .piece-option.selected {
            background: #10b981;
        }

        .equip-slot {
            display: flex;
            gap: 10px;
            margin: 10px 0;
            padding: 10px;
            background: #1a202c;
            border-radius: 8px;
        }

        .equip-item {
            padding: 8px 12px;
            background: #4a5568;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }

        .equip-item:hover {
            background: #6b7280;
        }
    </style>
</head>
<body>
    <h1 style="margin-bottom: 20px; color: #ffd700;">⚔️ 全将战棋 ⚔️</h1>
    
    <div id="selectionModal" class="modal">
        <div class="modal-content">
            <h2>选择你的武将</h2>
            <p id="selectionPrompt">玩家1 选择 5 个武将</p>
            <div id="pieceSelection" class="piece-select"></div>
            <p id="selectedCount">已选择: 0/5</p>
            <button id="confirmSelection" class="btn btn-primary" disabled>确认选择</button>
        </div>
    </div>

    <div class="game-container">
        <div class="panel">
            <div id="turnIndicator" class="turn-indicator player1">玩家1 回合</div>
            
            <h3>📊 武将信息</h3>
            <div id="pieceInfo" class="piece-info">
                <p>选择一个武将查看信息</p>
            </div>

            <h3>⚡ 技能</h3>
            <div id="skillButtons"></div>

            <h3>🛡️ 装备</h3>
            <div id="equipmentSlots" class="equip-slot">
                <div class="equip-item">武器: 无</div>
                <div class="equip-item">防具: 无</div>
                <div class="equip-item">饰品: 无</div>
            </div>
        </div>

        <div>
            <div id="gameBoard" class="game-board"></div>
            <div style="text-align: center; margin-top: 15px;">
                <button id="endTurnBtn" class="btn btn-primary">结束回合</button>
                <button id="restartBtn" class="btn btn-danger">重新开始</button>
            </div>
        </div>

        <div class="panel">
            <h3>🗺️ 地形说明</h3>
            <div style="font-size: 13px; line-height: 1.8;">
                <p><span style="color: #4ade80;">🌿 草地</span> - 正常移动</p>
                <p><span style="color: #22c55e;">🌲 森林</span> - 移动-1, 防御+10%</p>
                <p><span style="color: #9ca3af;">⛰️ 山地</span> - 移动-2, 防御+20%</p>
                <p><span style="color: #60a5fa;">💧 水域</span> - 无法通过</p>
            </div>

            <h3>📜 战斗日志</h3>
            <div id="gameLog" class="log-container"></div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
