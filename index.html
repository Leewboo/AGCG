<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>全将战棋</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --primary: #1a1a1a;
            --secondary: #f5f5f5;
            --accent-red: #e53935;
            --accent-blue: #1e88e5;
            --accent-green: #43a047;
            --text: #333;
            --text-light: #666;
            --border: #e0e0e0;
            --shadow: rgba(0,0,0,0.08);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--secondary);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            max-width: 1200px;
            margin: 0 auto;
            padding: 16px;
            gap: 16px;
        }

        .header {
            text-align: center;
            padding: 12px 0;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .turn-indicator {
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 12px;
            transition: all 0.3s ease;
        }

        .turn-indicator.player1 {
            background: var(--accent-red);
            color: white;
        }

        .turn-indicator.player2 {
            background: var(--accent-blue);
            color: white;
        }

        .board-wrapper {
            display: flex;
            justify-content: center;
            overflow-x: auto;
            padding: 8px 0;
        }

        .game-board {
            display: grid;
            gap: 2px;
            background: var(--border);
            padding: 4px;
            border-radius: 8px;
        }

        .cell {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            font-size: clamp(16px, 4vw, 28px);
            border-radius: 4px;
            transition: all 0.15s ease;
        }

        .cell.grass { background: #e8f5e9; }
        .cell.forest { background: #c8e6c9; }
        .cell.mountain { background: #e0e0e0; }
        .cell.water { background: #bbdefb; }
        .cell.default { background: #fafafa; }

        .cell:hover {
            filter: brightness(0.95);
        }

        .cell.selected {
            box-shadow: inset 0 0 0 3px var(--accent-blue);
        }

        .cell.move-range {
            box-shadow: inset 0 0 0 2px var(--accent-green);
        }

        .cell.attack-range {
            box-shadow: inset 0 0 0 2px var(--accent-red);
        }

        .piece {
            width: 80%;
            height: 80%;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            z-index: 10;
        }

        .piece.player1 {
            background: var(--accent-red);
            color: white;
        }

        .piece.player2 {
            background: var(--accent-blue);
            color: white;
        }

        .terrain-label {
            position: absolute;
            top: 2px;
            right: 2px;
            font-size: 8px;
            opacity: 0.5;
        }

        .panels {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        .panel {
            background: white;
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 2px 8px var(--shadow);
        }

        .panel h3 {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-light);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .piece-info {
            text-align: center;
        }

        .piece-symbol {
            font-size: 40px;
            margin-bottom: 8px;
        }

        .piece-name {
            font-weight: 600;
            font-size: 18px;
            margin-bottom: 12px;
        }

        .stat-bar {
            margin: 8px 0;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-light);
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .bar-bg {
            height: 8px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .health-fill {
            background: linear-gradient(90deg, #ef5350, #43a047);
        }

        .energy-fill {
            background: linear-gradient(90deg, #7e57c2, #5c6bc0);
        }

        .piece-stats {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 12px;
            font-size: 14px;
        }

        .skill-buttons {
            display: grid;
            gap: 8px;
        }

        .skill-btn {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border);
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
            text-align: left;
        }

        .skill-btn.active {
            border-color: var(--accent-blue);
            background: #e3f2fd;
        }

        .skill-btn.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .skill-btn.passive {
            background: #f5f5f5;
        }

        .skill-name {
            font-weight: 600;
        }

        .skill-desc {
            font-size: 12px;
            color: var(--text-light);
            margin-top: 4px;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: var(--accent-blue);
            color: white;
        }

        .btn-danger {
            background: var(--accent-red);
            color: white;
        }

        .log-container {
            max-height: 150px;
            overflow-y: auto;
            font-size: 12px;
            line-height: 1.6;
        }

        .log-entry {
            padding: 6px 0;
            border-bottom: 1px solid var(--border);
            color: var(--text-light);
        }

        .log-entry:last-child {
            border-bottom: none;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-content {
            background: white;
            padding: 24px;
            border-radius: 16px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
        }

        .modal-subtitle {
            text-align: center;
            color: var(--text-light);
            margin-bottom: 20px;
        }

        .piece-select {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 20px 0;
        }

        .piece-option {
            padding: 16px 8px;
            border: 2px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }

        .piece-option:hover {
            border-color: var(--accent-blue);
        }

        .piece-option.selected {
            border-color: var(--accent-blue);
            background: #e3f2fd;
        }

        .piece-option .symbol {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .piece-option .name {
            font-weight: 600;
            font-size: 14px;
        }

        .piece-option .stats {
            font-size: 11px;
            color: var(--text-light);
            margin-top: 4px;
        }

        .selected-count {
            text-align: center;
            font-weight: 600;
            margin: 12px 0;
        }

        .terrain-guide {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            font-size: 12px;
        }

        .terrain-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .terrain-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
        }

        @media (min-width: 768px) {
            .game-container {
                flex-direction: row;
                align-items: flex-start;
            }

            .board-wrapper {
                flex: 1;
            }

            .panels {
                width: 320px;
                flex-shrink: 0;
            }

            .cell {
                width: 56px;
                height: 56px;
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div id="selectionModal" class="modal">
        <div class="modal-content">
            <h2 class="modal-title">选择武将</h2>
            <p id="selectionPrompt" class="modal-subtitle">玩家1 选择 5 个武将</p>
            <div id="pieceSelection" class="piece-select"></div>
            <p id="selectedCount" class="selected-count">已选择: 0/5</p>
            <div style="display: flex; gap: 12px;">
                <button id="confirmSelection" class="btn btn-primary" style="flex: 1;" disabled>确认选择</button>
            </div>
        </div>
    </div>

    <div class="game-container">
        <div class="board-wrapper">
            <div>
                <div id="turnIndicator" class="turn-indicator player1">玩家1 回合</div>
                <div id="gameBoard" class="game-board"></div>
                <div class="action-buttons">
                    <button id="endTurnBtn" class="btn btn-primary">结束回合</button>
                    <button id="restartBtn" class="btn btn-danger">重新开始</button>
                </div>
            </div>
        </div>
        
        <div class="panels">
            <div class="panel">
                <h3>武将信息</h3>
                <div id="pieceInfo" class="piece-info">
                    <p style="color: var(--text-light);">选择一个武将查看信息</p>
                </div>
            </div>

            <div class="panel">
                <h3>技能</h3>
                <div id="skillButtons" class="skill-buttons">
                    <p style="color: var(--text-light);">选择武将查看技能</p>
                </div>
            </div>

            <div class="panel">
                <h3>战斗日志</h3>
                <div id="gameLog" class="log-container"></div>
            </div>

            <div class="panel">
                <h3>地形说明</h3>
                <div class="terrain-guide">
                    <div class="terrain-item">
                        <div class="terrain-color" style="background: #e8f5e9;"></div>
                        <span>🌿 草地 - 正常</span>
                    </div>
                    <div class="terrain-item">
                        <div class="terrain-color" style="background: #c8e6c9;"></div>
                        <span>🌲 森林 - 防御+10%</span>
                    </div>
                    <div class="terrain-item">
                        <div class="terrain-color" style="background: #e0e0e0;"></div>
                        <span>⛰️ 山地 - 防御+20%</span>
                    </div>
                    <div class="terrain-item">
                        <div class="terrain-color" style="background: #bbdefb;"></div>
                        <span>💧 水域 - 不可通过</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
