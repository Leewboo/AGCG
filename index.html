<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>全将战棋</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
    <!-- 主菜单 -->
    <div id="menu" class="screen active">
        <h1>全将战棋</h1>
        <p class="subtitle">世界策略对弈</p>
        <div class="btn-group">
            <button class="btn" data-mode="pvp">双人对战</button>
            <button class="btn" data-mode="pve">人机对战</button>
        </div>
    </div>

    <!-- 选将 -->
    <div id="select" class="screen">
        <div class="header">
            <span id="select-title">红方选将</span>
            <span id="select-count">0/5</span>
        </div>
        <div id="general-list" class="grid"></div>
        <button id="select-confirm" class="btn" disabled>确认</button>
    </div>

    <!-- 布阵 -->
    <div id="deploy" class="screen">
        <div class="header">
            <span id="deploy-title">红方布阵 0/5</span>
        </div>
        <div id="board" class="board"></div>
        <div id="deploy-list" class="deploy-panel"></div>
    </div>

    <!-- 对战 -->
    <div id="battle" class="screen">
        <div class="header">
            <span id="turn-info">第1回合 红方</span>
            <button id="end-turn" class="btn-small">结束回合</button>
        </div>
        <div id="battle-board" class="board"></div>
        <div id="unit-panel" class="panel"></div>
        <div id="log" class="log"></div>
    </div>

    <!-- 结算 -->
    <div id="gameover" class="screen">
        <h1 id="winner-text">红方 胜利</h1>
        <button id="restart" class="btn">再来一局</button>
    </div>
</div>

<script src="js/data.js"></script>
<script src="js/game.js"></script>
</body>
</html>
